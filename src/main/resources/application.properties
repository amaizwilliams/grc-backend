spring.config.import=optional:file:.env[.properties]
spring.application.name=gestion_reparacion_colision
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

# Muestra en consola el SQL que ejecuta Hibernate (util al crear las tablas).
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Vinculamos la variable de Spring con el .env
jwt.secret=${JWT_SECRET}
# Tiempo de expiración del token en segundos (2 horas)
jwt.expiration=3600

# Orígenes permitidos por CORS, leídos del .env (lista separada por comas)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}