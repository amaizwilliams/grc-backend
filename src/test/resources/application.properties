# Configuracion SOLO para validar el modelo sin base de datos.
#
# Construye el EntityManagerFactory completo (detecta mappedBy mal escritos, FKs
# rotas, enums sin import, etc.) y exporta el DDL a target/schema-modelo.sql,
# todo sin conectarse a MySQL: initialization-fail-timeout=-1 hace que Hikari no
# falle el arranque aunque la conexion no exista.
#
# Las credenciales de abajo son ficticias a proposito. No hay que crear el
# usuario 'validador' ni la base 'validacion_modelo'.
spring.datasource.url=jdbc:mysql://localhost:3306/validacion_modelo
spring.datasource.username=validador
spring.datasource.password=validador
spring.datasource.hikari.initialization-fail-timeout=-1
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.jakarta.persistence.schema-generation.scripts.action=create
spring.jpa.properties.jakarta.persistence.schema-generation.scripts.create-target=target/schema-modelo.sql
spring.jpa.properties.hibernate.hbm2ddl.delimiter=;
spring.jpa.properties.hibernate.format_sql=true

# JWT para el test de contexto (clave falsa, solo pruebas; minimo 32 caracteres)
jwt.secret=clave-de-prueba-solo-para-tests-0123456789
jwt.expiration=3600
